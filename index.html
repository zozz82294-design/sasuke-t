<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX_SASUKE | VIP Unlocker</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #ff0000; --bg: #0a0a0b; --card: #151517; --accent: #22c55e; --fail: #ef4444; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; position: relative; }
        
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: fall linear infinite; }
        @keyframes fall { from { transform: translateY(-10vh); } to { transform: translateY(110vh); } }
        
        .container { width: 90%; max-width: 420px; text-align: center; padding: 20px 0; z-index: 10; position: relative; }
        
        .yt-logo { width: 50px; margin-bottom: 10px; transition: 0.3s; }
        .page-title { font-size: 24px; font-weight: bold; margin-bottom: 25px; word-wrap: break-word; line-height: 1.4; transition: 0.3s; }
        
        .video-card { position: relative; width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 25px; border: 1px solid #333; cursor: pointer; background: #111; min-height: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-card img { width: 100%; display: block; }
        
        .task-box { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border: 2px solid transparent; text-align: right; cursor: pointer; transition: 0.3s; }
        .task-box.active { border-color: var(--main); }
        .task-box.done { border-color: var(--accent); cursor: default; }
        
        .task-info { flex-grow: 1; margin-right: 15px; }
        .task-info h4 { margin: 0; font-size: 16px; color: white; }
        .task-info p { margin: 5px 0 0; font-size: 12px; color: #94a3b8; }
        
        .step-num { width: 35px; height: 35px; background: #222; border: 2px solid #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--main); transition: 0.3s; }
        .task-box.active .step-num { border-color: var(--main); background: rgba(255,0,0,0.1); }
        .task-box.done .step-num { background: var(--accent); color: white; border-color: var(--accent); }
        
        .checker-card { background: #0f0f10; border: 1px solid #222; border-radius: 15px; padding: 15px; margin-top: 20px; }
        #count-num { font-size: 32px; font-weight: bold; display: block; margin: 5px 0; }
        
        .verify-btn { background: var(--main); color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; transition: 0.3s; }
        .verify-btn:disabled { background: #1a1a1c; color: #555; cursor: not-allowed; }
        
        #error-msg { display: none; color: var(--fail); font-size: 13px; margin-top: 10px; font-weight: bold; line-height: 1.5; }

        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .circle-timer { width: 60px; height: 60px; border: 5px solid #222; border-top: 5px solid var(--main); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        #countdown-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .countdown-wrapper { position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .countdown-num { position: absolute; font-size: 40px; font-weight: bold; color: white; }
        .progress-ring { transform: rotate(-90deg); }
        #progress-circle { stroke-dasharray: 264; stroke-dashoffset: 0; stroke-linecap: round; }
        @keyframes circle-deplete { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 264; } }
        
        .gen-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #111; color: white; box-sizing: border-box; text-align: right; font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body>

<div class="stars-container" id="stars"></div>

<div id="countdown-overlay">
    <div class="countdown-wrapper">
        <svg class="progress-ring" width="100" height="100">
            <circle stroke="#333" stroke-width="6" fill="transparent" r="42" cx="50" cy="50"/>
            <circle id="progress-circle" stroke="var(--main)" stroke-width="6" fill="transparent" r="42" cx="50" cy="50"/>
        </svg>
        <span id="countdown-number" class="countdown-num">5</span>
    </div>
    <h2 style="margin-top: 10px; font-size: 24px;">انتظر قليلاً... ⏳</h2>
    <p style="color: #888; font-size: 14px; text-align: center; width: 80%;">انتظر فقط، النظام يتحقق من إتمامك للشرط</p>
</div>

<div id="loader">
    <div class="circle-timer"></div>
    <h2 id="timer-text" style="font-size: 26px; margin: 20px 0; text-align: center;">جاري التحقق... ⏳</h2>
</div>

<div id="app" class="container"></div>

<script>
function createStars() {
    var container = document.getElementById('stars');
    if(!container) return;
    for (var i = 0; i < 50; i++) {
        var star = document.createElement('div');
        star.className = 'star';
        var size = Math.random() * 3 + 1 + 'px';
        star.style.width = size;
        star.style.height = size;
        star.style.left = Math.random() * 100 + '%';
        star.style.animationDuration = (Math.random() * 4 + 3) + 's';
        star.style.animationDelay = (Math.random() * 5) + 's';
        container.appendChild(star);
    }
}
createStars();

try {
    var YOUTUBE_API_KEY = "AIzaSyA6NebhJLqT8ZEG56cmMEm4xsRR5byisPI"; 

    var app = document.getElementById('app');
    var urlParams = window.location.search;

    function safeEncode(str) { try { return btoa(encodeURIComponent(str || "")); } catch(e){ return ""; } }
    function safeDecode(str) { try { return decodeURIComponent(atob(str.replace(/ /g, '+'))); } catch(e) { return ""; } }
    function fixUrl(url) {
        if (!url || url === 'undefined') return "#";
        url = url.trim();
        if (!/^https?:\/\//i.test(url) && url !== "#") return 'https://' + url;
        return url;
    }

    if (urlParams.indexOf('data=') !== -1) {
        var rawData = urlParams.split('data=')[1];
        var raw = decodeURIComponent(rawData).split('|');
        
        var config = {
            t: safeDecode(raw[0]),
            c: fixUrl(safeDecode(raw[1] || raw[0])),
            v: fixUrl(safeDecode(raw[2] || raw[1])),
            f: fixUrl(safeDecode(raw[3] || raw[2])),
            tut: raw[4] ? fixUrl(safeDecode(raw[4])) : "" 
        };

        var vIdMatch = config.v.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([^#\&\?]*)/);
        var vId = vIdMatch && vIdMatch[1].length === 11 ? vIdMatch[1] : null;
        var thumb = vId ? 'https://img.youtube.com/vi/' + vId + '/maxresdefault.jpg' : 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png';

        var sub = false, vidLike = false, vidComment = false;
        var initialLikes = -1; 
        
        // المتغير الجديد: عدد محاولات التحقق
        var verifyAttempts = 0;

        var tutSection = "";
        if(config.tut && config.tut !== "#") {
            tutSection = `
                <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
                    <p style="color: #e2e8f0; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: bold; text-align: center; margin: 0 0 10px 0; line-height: 1.6;">
                        اذا مو عارف كيف تتخطي الروابط سايبلك تحت رابط فيديو طريقه تخطي الروابط
                    </p>
                    <button style="display: block; width: 100%; background: #3b82f6; padding: 12px; border-radius: 10px; color: white; border: none; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);" onclick="window.open('${config.tut}', '_blank')">📺 فيديو شرح كيفية تخطي الروابط</button>
                </div>
            `;
        }

        app.innerHTML = `
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" class="yt-logo" id="top-logo">
            <div class="page-title" id="top-title">${config.t}</div>

            <div id="tasks-container">
                <div class="video-card" onclick="openT('vl')">
                    <img src="${thumb}">
                </div>

                <div class="task-box active" id="tk1" onclick="openT('c')">
                    <div class="task-info">
                        <h4>Subscribe to channel</h4>
                        <p>اضغط هنا للاشتراك في القناة</p>
                    </div>
                    <div class="step-num"><span>1</span></div>
                </div>

                <div class="task-box" id="tk2" onclick="openT('vl')">
                    <div class="task-info">
                        <h4>Like the video</h4>
                        <p>اعمل لايك على المقطع</p>
                    </div>
                    <div class="step-num"><span>2</span></div>
                </div>

                <div class="task-box" id="tk3" onclick="openT('vc')">
                    <div class="task-info">
                        <h4>Comment on video</h4>
                        <p>اعمل كومنت على المقطع</p>
                    </div>
                    <div class="step-num"><span>3</span></div>
                </div>

                <div class="checker-card">
                    <span style="color:#888; font-size:12px;">اللايكات الحالية:</span>
                    <span id="count-num">...</span>
                    <button class="verify-btn" id="vBtn" onclick="verifyStrict()">تحقق من الشروط 🔍</button>
                    <div id="error-msg">❌ فشل التحقق: تأكد من إتمام الشروط.</div>
                    
                    ${tutSection}
                </div>
            </div>

            <div id="success-container" style="display: none; background: var(--card); border-radius: 15px; padding: 35px 20px; text-align: center; border: 1px solid #333; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
                <div style="font-size: 70px; margin-bottom: 10px; animation: bounce-icon 2s infinite;">🎉</div>
                
                <h2 style="margin: 0 0 25px; font-size: 28px; color: white;">احسنت يا بطل 😎</h2>
                
                <button style="display: block; width: 100%; background: #ef4444; padding: 15px; border-radius: 12px; color: white; border: none; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);" onclick="window.open('https://youtu.be/wOaEuyXW9H0?si=Rn1iFmkvuytRDFLO', '_blank')">🛠️ طريقة حل مشكلة يرجى تعطيل مانع الاعلانات</button>

                <button style="display: block; width: 100%; background: var(--accent); padding: 18px; border-radius: 12px; color: white; border: none; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 5px 15px rgba(34, 197, 94, 0.3);" onclick="window.location.href='${config.f}'">🔓 افتح الرابط</button>
            </div>
        `;

        function fetchRealLikes(callback) {
            if (!vId) { callback(-1); return; }
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "https://www.googleapis.com/youtube/v3/videos?part=statistics&id=" + vId + "&key=" + YOUTUBE_API_KEY + "&t=" + new Date().getTime(), true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if(data.items && data.items.length > 0) {
                            callback(parseInt(data.items[0].statistics.likeCount));
                        } else { callback(-1); }
                    } catch(e) { callback(-1); }
                } else { callback(-1); }
            };
            xhr.onerror = function() { callback(-1); };
            xhr.send();
        }

        fetchRealLikes(function(likes) {
            if (likes !== -1) {
                initialLikes = likes;
                document.getElementById('count-num').innerText = initialLikes.toLocaleString('en-US');
            } else {
                document.getElementById('count-num').innerText = "حدث خطأ";
            }
        });

        window.openT = function(type) {
            if (type === 'c' && sub) return;
            if (type === 'vl' && vidLike) return;
            if (type === 'vc' && vidComment) return;

            window.open(type === 'c' ? config.c : config.v, '_blank');

            var overlay = document.getElementById('countdown-overlay');
            var numSpan = document.getElementById('countdown-number');
            var progCircle = document.getElementById('progress-circle');
            
            overlay.style.display = 'flex';
            progCircle.style.animation = 'none';
            void progCircle.offsetWidth; 
            progCircle.style.animation = 'circle-deplete 5s linear forwards';
            
            var timeLeft = 5;
            numSpan.innerText = timeLeft;

            var timer = setInterval(function() {
                timeLeft--;
                numSpan.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    overlay.style.display = 'none';

                    if(type === 'c') { 
                        sub = true; 
                        document.getElementById('tk1').classList.remove('active');
                        document.getElementById('tk1').classList.add('done'); 
                        document.getElementById('tk1').querySelector('.step-num span').innerText = '✓';
                        if(!vidLike) document.getElementById('tk2').classList.add('active'); 
                    } else if(type === 'vl') { 
                        vidLike = true; 
                        document.getElementById('tk2').classList.remove('active');
                        document.getElementById('tk2').classList.add('done'); 
                        document.getElementById('tk2').querySelector('.step-num span').innerText = '✓';
                        if(!vidComment) document.getElementById('tk3').classList.add('active');
                    } else if(type === 'vc') {
                        vidComment = true; 
                        document.getElementById('tk3').classList.remove('active');
                        document.getElementById('tk3').classList.add('done'); 
                        document.getElementById('tk3').querySelector('.step-num span').innerText = '✓';
                    }
                }
            }, 1000);
        };

        // دالة التحقق بنظام "الفرصة التانية"
        window.verifyStrict = function() {
            if(!sub || !vidLike || !vidComment) return alert("يرجى إكمال جميع المهام الثلاثة أولاً!");
            
            var errMsg = document.getElementById('error-msg');
            errMsg.style.display = 'none';
            
            var ld = document.getElementById('loader');
            ld.style.display = 'flex';
            
            // زيادة العداد كل ما يدوس تحقق
            verifyAttempts++;
            
            setTimeout(function() {
                fetchRealLikes(function(currentLikes) {
                    ld.style.display = 'none';
                    
                    if (currentLikes !== -1) {
                        document.getElementById('count-num').innerText = currentLikes.toLocaleString('en-US');
                    }

                    // لو يوتيوب حدث الرقم ولقيناه زاد.. أو لو المتابع داس "أعد التحقق" للمرة التانية هيعديه عشان ميظلموش.
                    if (currentLikes > initialLikes || verifyAttempts >= 2) {
                        document.getElementById('tasks-container').style.display = 'none';
                        document.getElementById('top-logo').style.display = 'none';
                        document.getElementById('top-title').style.display = 'none';
                        document.getElementById('success-container').style.display = 'block';
                        
                        try {
                            if (typeof confetti !== 'undefined') {
                                confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff0000', '#22c55e', '#ffffff'] });
                                confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff0000', '#22c55e', '#ffffff'] });
                            }
                        } catch(e){}
                    } else {
                        // دي في أول محاولة بس: لو الرقم لسه مزادش، يرفضه ويقوله حاول تاني.
                        errMsg.innerHTML = "❌ فشل التحقق: يوتيوب لم يسجل اللايك الخاص بك بعد!<br>تأكد من وضع اللايك، ثم اضغط <b>أعد التحقق</b> مرة أخرى.";
                        errMsg.style.display = 'block';
                        document.getElementById('vBtn').innerText = "أعد التحقق 🔄";
                        
                        if (currentLikes !== -1 && currentLikes < initialLikes) {
                            initialLikes = currentLikes; 
                        }
                    }
                });
            }, 2500); // تحميل 2.5 ثانية
        };

    } else {
        app.innerHTML = `
            <div class="task-box" style="display:block; text-align:center; cursor:default;">
                <h2 style="color:var(--accent); margin-top:0;">MX_SASUKE VIP Generator</h2>
                <input type="text" id="it" class="gen-input" value="لازم تعمل اشتراك ولايك وتعليق للحصول على السكربت">
                <input type="url" id="ic" class="gen-input" placeholder="👇 رابط قناتك (اشتراك)">
                <input type="url" id="iv" class="gen-input" placeholder="👇 رابط فيديو اليوتيوب (اللايك والتعليق)">
                <input type="url" id="itut" class="gen-input" placeholder="👇 رابط فيديو الشرح (اختياري)">
                <input type="url" id="if" class="gen-input" placeholder="👇 الرابط النهائي (ميديا فاير)">
                <button class="verify-btn" onclick="gen()">إنشاء الصفحة</button>
            </div>
        `;
        window.gen = function() {
            var d = [
                safeEncode(document.getElementById('it').value),
                safeEncode(document.getElementById('ic').value),
                safeEncode(document.getElementById('iv').value),
                safeEncode(document.getElementById('if').value),
                safeEncode(document.getElementById('itut').value)
            ].join('|');
            window.location.href = "?data=" + encodeURIComponent(d);
        };
    }
} catch (error) {
    document.getElementById('app').innerHTML = `<h3 style="color:red; margin-top:50px;">يوجد خطأ: تأكد من نسخ الكود بالكامل</h3>`;
}
</script>
</body>
</html>
