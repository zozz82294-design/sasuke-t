<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الجاسوس</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #111;
  color: white;
}

.container {
  margin-top: 50px;
}

input, button {
  padding: 10px;
  margin: 10px;
  font-size: 18px;
}

.card {
  margin-top: 30px;
  padding: 20px;
  border: 2px solid white;
  display: inline-block;
}
</style>
</head>

<body>

<div class="container">

<h1>🕵️‍♂️ لعبة الجاسوس</h1>

<div id="setup">
  <input type="number" id="players" placeholder="عدد اللاعبين">
  <button onclick="startGame()">ابدأ</button>
</div>

<div id="game" style="display:none;">
  <h2 id="playerTurn"></h2>
  <button onclick="showRole()">اعرف دورك</button>

  <div class="card" id="roleCard" style="display:none;"></div>

  <br>
  <button onclick="nextPlayer()">التالي</button>
</div>

<div id="end" style="display:none;">
  <h2>خلصت اللعبة 🎉</h2>
  <button onclick="location.reload()">إعادة</button>
</div>

</div>

<script>

let players = 0;
let current = 1;
let roles = [];
let word = "";

const words = ["مدرسة", "مطعم", "بحر", "مطار", "مستشفى"];

function startGame() {
  players = document.getElementById("players").value;

  if (players < 3) {
    alert("لازم 3 لاعبين على الأقل");
    return;
  }

  word = words[Math.floor(Math.random() * words.length)];

  let spyIndex = Math.floor(Math.random() * players);

  for (let i = 0; i < players; i++) {
    if (i === spyIndex) {
      roles.push("🕵️‍♂️ جاسوس");
    } else {
      roles.push("الكلمة: " + word);
    }
  }

  document.getElementById("setup").style.display = "none";
  document.getElementById("game").style.display = "block";

  updateTurn();
}

function updateTurn() {
  document.getElementById("playerTurn").innerText = "الدور على اللاعب " + current;
  document.getElementById("roleCard").style.display = "none";
}

function showRole() {
  document.getElementById("roleCard").innerText = roles[current - 1];
  document.getElementById("roleCard").style.display = "block";
}

function nextPlayer() {
  current++;

  if (current > players) {
    document.getElementById("game").style.display = "none";
    document.getElementById("end").style.display = "block";
    return;
  }

  updateTurn();
}

</script>

</body>
</html>
