<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الجاسوس</title>

<style>
body {
  font-family: Cairo;
  background: linear-gradient(45deg,#0f172a,#1e293b);
  color: white;
  text-align: center;
}

button {
  padding: 12px;
  border: none;
  border-radius: 10px;
  margin: 10px;
}

.start {
  background: gray;
}

.start.active {
  background: green;
}

.categories {
  display: none;
}

.cat {
  background: #334155;
  padding: 15px;
  margin: 10px;
  border-radius: 10px;
  transition: 0.3s;
  cursor: pointer;
}

.cat:hover {
  transform: scale(1.1);
  background: #22c55e;
}
</style>
</head>

<body>

<h2>🕵️‍♂️ لعبة الجاسوس</h2>

<button onclick="createRoom()">🎮 إنشاء غرفة</button>

<button id="startBtn" class="start">▶️ بدء اللعب</button>

<div id="categories" class="categories">
  <div class="cat" onclick="selectCat('anime')">أنمي</div>
  <div class="cat" onclick="selectCat('cartoon')">كرتون</div>
  <div class="cat" onclick="selectCat('objects')">جماد</div>
  <div class="cat" onclick="selectCat('animals')">حيوانات</div>
  <div class="cat" onclick="selectCat('apps')">تطبيقات</div>
</div>

<div id="role"></div>

<script src="/socket.io/socket.io.js"></script>

<script>
let socket = io();
let isHost = false;
let selectedCat = null;

function createRoom(){
  isHost = true;
  socket.emit("createRoom","𝐒𝐀𝐒𝐔𝐊𝐄");
}

socket.on("updatePlayers",(players)=>{
  if(players.length >=3 && isHost){
    let btn = document.getElementById("startBtn");
    btn.classList.add("active");

    btn.onclick = ()=>{
      socket.emit("startGame");
    }
  }
});

socket.on("showCategories",()=>{
  document.getElementById("categories").style.display="block";
});

// تحديد
function selectCat(cat){
  if(!isHost) return;

  selectedCat = cat;

  document.querySelectorAll(".cat").forEach(c=>{
    c.style.background="#334155";
  });

  event.target.style.background="gold";
}

// اختيار نهائي
document.getElementById("startBtn").addEventListener("dblclick",()=>{
  if(selectedCat){
    socket.emit("chooseCategory",selectedCat);
  }
});

socket.on("categoryChosen",(cat)=>{
  document.body.innerHTML += `<h3>تم اختيار: ${cat}</h3>`;
});

// عرض الدور
socket.on("yourRole",(data)=>{
  const div = document.getElementById("role");

  if(data.spy){
    div.innerHTML = `
      <h2>🕵️‍♂️ انت الجاسوس</h2>
      <p>التصنيف: ${data.category}</p>
    `;
  } else {
    div.innerHTML = `
      <h2>🔑 الكلمة: ${data.word}</h2>
      <p>التصنيف: ${data.category}</p>
    `;
  }
});
</script>

</body>
</html>
