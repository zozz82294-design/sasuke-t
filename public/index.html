<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الجاسوس</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Cairo;
  background: #0f172a;
  color: white;
}

/* زر الاعدادات */
.settings-btn {
  position: fixed;
  top: 15px;
  left: 15px;
  font-size: 24px;
  cursor: pointer;
  display: none;
}

/* القائمة */
.settings-panel {
  position: fixed;
  top: 0;
  left: -100%;
  width: 80%;
  height: 100%;
  background: #1e293b;
  padding: 20px;
  transition: 0.3s;
}

.settings-panel.active {
  left: 0;
}

.player-item {
  background: #334155;
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
}

button {
  margin-top: 5px;
  padding: 6px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="settings-btn" id="settingsBtn">⚙️</div>

<div class="settings-panel" id="settingsPanel">
  <h3>⚙️ الإعدادات</h3>

  <div id="playersList"></div>

  <button id="restartBtn" style="display:none;">🔄 إعادة اللعب</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let socket = io();
let isHost = false;

// إنشاء روم
function createRoom() {
  isHost = true;
  socket.emit("createRoom", "𝐒𝐀𝐒𝐔𝐊𝐄");
  document.getElementById("settingsBtn").style.display = "block";
}

// فتح/قفل الإعدادات
document.getElementById("settingsBtn").onclick = () => {
  document.getElementById("settingsPanel").classList.toggle("active");
};

// تحديث اللاعبين
socket.on("updatePlayers", (players) => {
  const list = document.getElementById("playersList");
  list.innerHTML = "";

  players.forEach(p => {
    const div = document.createElement("div");
    div.className = "player-item";

    div.innerHTML = `
      ${p.name}
      ${isHost ? `
        <br>
        <button onclick="renamePlayer('${p.id}')">✏️ تغيير الاسم</button>
        <button onclick="kickPlayer('${p.id}')">❌ طرد</button>
      ` : ""}
    `;

    list.appendChild(div);
  });

  // 🔥 يظهر إعادة اللعب لو 3 لاعبين
  if (players.length >= 3 && isHost) {
    document.getElementById("restartBtn").style.display = "block";
  }
});

// تغيير اسم
function renamePlayer(id) {
  const newName = prompt("اكتب الاسم الجديد:");
  if (newName) {
    socket.emit("renamePlayer", { id, newName });
  }
}

// طرد
function kickPlayer(id) {
  socket.emit("kickPlayer", id);
}

// إعادة اللعب
document.getElementById("restartBtn").onclick = () => {
  socket.emit("restartGame");
};
</script>

</body>
</html>
