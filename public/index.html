<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الجاسوس</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Cairo;
  background: #0f172a;
  color: white;
  text-align: center;
}

/* زر المغادرة */
.leave-btn {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: red;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* شاشة الخروج */
.leave-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #000;
  display: none;
  justify-content: center;
  align-items: center;
  font-size: 24px;
}
</style>
</head>

<body>

<h1>🕵️‍♂️ لعبة الجاسوس</h1>

<button onclick="createRoom()">🎮 إنشاء غرفة</button>

<div id="joinSection" style="display:none;">
  <input id="nameInput" placeholder="اكتب اسمك">
  <button onclick="joinRoom()">🚀 انضمام</button>
</div>

<button class="leave-btn" onclick="leaveGame()">🚪 مغادرة</button>

<div id="leaveScreen" class="leave-screen">
  ❗ لقد غادرت اللعبة
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let socket = io();
let currentRoom = null;

// إنشاء روم
function createRoom() {
  currentRoom = Math.floor(Math.random() * 9999);

  localStorage.setItem("roomId", currentRoom);
  localStorage.setItem("playerName", "𝐒𝐀𝐒𝐔𝐊𝐄");

  socket.emit("createRoom", "𝐒𝐀𝐒𝐔𝐊𝐄");
}

// دخول من لينك
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get("room");

// لو في روم محفوظ
const savedRoom = localStorage.getItem("roomId");
const savedName = localStorage.getItem("playerName");

if (savedRoom && savedName) {
  currentRoom = savedRoom;
  socket.emit("joinRoom", { roomId: savedRoom, name: savedName });
}
else if (roomId) {
  currentRoom = roomId;
  document.getElementById("joinSection").style.display = "block";
}

// انضمام
function joinRoom() {
  const name = document.getElementById("nameInput").value;

  if (!name) return alert("اكتب اسمك");

  localStorage.setItem("roomId", currentRoom);
  localStorage.setItem("playerName", name);

  socket.emit("joinRoom", { roomId: currentRoom, name });
}

// مغادرة
function leaveGame() {
  localStorage.removeItem("roomId");
  localStorage.removeItem("playerName");

  socket.disconnect();

  document.getElementById("leaveScreen").style.display = "flex";
}
</script>

</body>
</html>
