<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الجاسوس</title>

<style>
body{
  margin:0;
  font-family:Cairo;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* الكارد */
.container{
  background:#1e293b;
  padding:35px;
  border-radius:25px;
  width:95%;
  max-width:420px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
}

/* عنوان */
h2{
  font-size:26px;
  margin-bottom:10px;
}

/* زرار */
button{
  padding:16px;
  border:none;
  border-radius:12px;
  margin-top:12px;
  width:100%;
  background:linear-gradient(45deg,#6366f1,#8b5cf6);
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

/* اللينك */
.link-box{
  background:#0f172a;
  padding:12px;
  border-radius:12px;
  margin-top:12px;
  font-size:14px;
  word-break:break-all;
}

/* لاعب */
.player{
  background:#0f172a;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  font-size:16px;
}

/* تم النسخ */
.copied{
  background:#22c55e !important;
}
</style>

</head>

<body>

<div class="container">

  <h2>🕵️‍♂️ لعبة الجاسوس</h2>

  <!-- زرار -->
  <button onclick="createRoom()">🎮 إنشاء غرفة</button>

  <!-- اللينك -->
  <div id="linkBox" class="link-box" style="display:none"></div>

  <!-- زر النسخ -->
  <button id="copyBtn" style="display:none" onclick="copyLink()">📋 نسخ الرابط</button>

  <!-- اللاعبين -->
  <div id="players"></div>

  <!-- بدء -->
  <button id="startBtn" style="display:none">🚀 بدء اللعب</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let socket = io();
let isHost=false;
let myName="𝐒𝐀𝐒𝐔𝐊𝐄";

/* إنشاء غرفة */
function createRoom(){
  isHost=true;

  socket.emit("createRoom", myName);

  let roomId = Math.floor(Math.random()*10000);
  let link = window.location.origin + "?room=" + roomId;

  let linkBox = document.getElementById("linkBox");
  let copyBtn = document.getElementById("copyBtn");

  linkBox.innerText = link;
  linkBox.style.display="block";

  copyBtn.style.display="block";
}

/* نسخ */
function copyLink(){
  let linkBox = document.getElementById("linkBox");
  let btn = document.getElementById("copyBtn");

  navigator.clipboard.writeText(linkBox.innerText);

  // اخفاء اللينك
  linkBox.style.display="none";

  // تغيير شكل الزرار
  btn.innerText="✅ تم النسخ";
  btn.classList.add("copied");
  btn.disabled=true;
}

/* تحديث اللاعبين */
socket.on("updatePlayers",(players)=>{
  let div=document.getElementById("players");
  div.innerHTML="<h3>👥 اللاعبين</h3>";

  players.forEach(p=>{
    div.innerHTML+=`<div class="player">${p.name}</div>`;
  });

  if(players.length>=3 && isHost){
    let startBtn = document.getElementById("startBtn");
    startBtn.style.display="block";

    startBtn.onclick=()=>{
      socket.emit("startGame");
    };
  }
});
</script>

</body>
</html>
