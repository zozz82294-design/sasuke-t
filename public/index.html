<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لعبة الجاسوس</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;

  background: linear-gradient(-45deg, #0f0f0f, #1a1a2e, #16213e, #0f3460);
  background-size: 400% 400%;
  animation: gradientMove 18s ease infinite;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container {
  width: 95%;
  max-width: 520px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(15px);
  padding: 35px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 0 50px rgba(0,0,0,0.6);
}

h1 {
  font-size: 28px;
  margin-bottom: 25px;
}

button {
  width: 100%;
  padding: 18px;
  border-radius: 15px;
  border: none;
  background: linear-gradient(45deg, #6c5ce7, #a29bfe);
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
  margin-top: 10px;
}

button:hover {
  transform: scale(1.05);
}

.link-box {
  margin-top: 20px;
  padding: 15px;
  background: #111;
  border-radius: 12px;
  word-break: break-all;
  font-size: 14px;
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 15px;
}

li {
  margin: 8px 0;
  padding: 10px;
  background: #222;
  border-radius: 10px;
  font-size: 18px;
}

</style>
</head>

<body>

<div class="container">

<h1>🕵️‍♂️ لعبة الجاسوس</h1>

<button onclick="createRoom()">🎮 لعبة الجاسوس 1</button>

<div id="link" class="link-box" style="display:none;"></div>

<button id="copyBtn" style="display:none;" onclick="copyLink()">📋 نسخ الرابط</button>

<ul id="players"></ul>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let socket;
let currentLink = "";

try {
  socket = io();
} catch (e) {
  alert("مشكلة في الاتصال بالسيرفر");
}

function createRoom() {
  socket.emit("createRoom", "𝐒𝐀𝐒𝐔𝐊𝐄");
}

// نسخ الرابط
function copyLink() {
  navigator.clipboard.writeText(currentLink).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.innerText = "✅ تم النسخ";
    
    setTimeout(() => {
      btn.style.display = "none"; // 🔥 يختفي بعد النسخ
    }, 800);
  });
}

// دخول من لينك
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get("room");

if (roomId) {
  const name = prompt("اكتب اسمك:");
  socket.emit("joinRoom", { roomId, name });
}

// عرض اللينك
socket.on("roomCreated", (id) => {
  const link = window.location.origin + "?room=" + id;
  currentLink = link;

  const box = document.getElementById("link");
  box.style.display = "block";
  box.innerText = "📎 اللينك:\n" + link;

  document.getElementById("copyBtn").style.display = "block";
});

// عرض اللاعبين
socket.on("updatePlayers", (players) => {
  const list = document.getElementById("players");
  list.innerHTML = "";

  players.forEach(p => {
    const li = document.createElement("li");

    if (p.name === "𝐒𝐀𝐒𝐔𝐊𝐄") {
      li.textContent = "𝐒𝐀𝐒𝐔𝐊𝐄 👑";
    } else {
      li.textContent = p.name;
    }

    list.appendChild(li);
  });
});

socket.on("errorMsg", (msg) => {
  alert(msg);
});
</script>

</body>
</html>
