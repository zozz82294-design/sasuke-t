<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الجاسوس</title>

<style>
body{
  margin:0;
  font-family:Cairo;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* الكارد الرئيسي */
.container{
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  text-align:center;
  box-shadow:0 0 30px rgba(0,0,0,0.5);
}

/* زرار */
button{
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  width:100%;
  background:linear-gradient(45deg,#6366f1,#8b5cf6);
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

/* اللينك */
.link-box{
  background:#0f172a;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-size:13px;
  word-break:break-all;
}

/* اللاعبين */
.player{
  background:#0f172a;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}
</style>

</head>

<body>

<div class="container">

  <h2>🕵️‍♂️ لعبة الجاسوس</h2>

  <!-- زرار إنشاء -->
  <button onclick="createRoom()">🎮 إنشاء غرفة</button>

  <!-- اللينك -->
  <div id="linkBox" class="link-box" style="display:none"></div>
  <button id="copyBtn" style="display:none" onclick="copyLink()">📋 نسخ الرابط</button>

  <!-- اللاعبين -->
  <div id="players"></div>

  <!-- بدء -->
  <button id="startBtn" style="display:none">🚀 بدء اللعب</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let socket = io();
let isHost=false;
let myName="𝐒𝐀𝐒𝐔𝐊𝐄";

/* إنشاء غرفة */
function createRoom(){
  isHost=true;

  socket.emit("createRoom", myName);

  // إنشاء لينك
  let roomId = Math.floor(Math.random()*10000);
  let link = window.location.origin + "?room=" + roomId;

  document.getElementById("linkBox").innerText = link;
  document.getElementById("linkBox").style.display="block";

  document.getElementById("copyBtn").style.display="block";

  // إرسال للسيرفر (اختياري لو هتربطه)
  window.roomId = roomId;
}

/* نسخ */
function copyLink(){
  let text = document.getElementById("linkBox").innerText;

  navigator.clipboard.writeText(text);

  document.getElementById("copyBtn").style.display="none";
}

/* تحديث اللاعبين */
socket.on("updatePlayers",(players)=>{
  let div=document.getElementById("players");
  div.innerHTML="<h3>👥 اللاعبين</h3>";

  players.forEach(p=>{
    div.innerHTML+=`<div class="player">${p.name}</div>`;
  });

  if(players.length>=3 && isHost){
    document.getElementById("startBtn").style.display="block";

    document.getElementById("startBtn").onclick=()=>{
      socket.emit("startGame");
    };
  }
});
</script>

</body>
</html>
