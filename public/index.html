<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io({
  transports: ["websocket"]
});

let selectedMode = null;

// 🔥 يظهر الاختيارات
function createRoom() {
  document.getElementById("modeBox").style.display = "flex";
}

// 🔥 اختيار المود
function selectMode(el, mode) {
  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  el.classList.add("active");
  selectedMode = mode;

  // 💾 حفظ الاختيار
  localStorage.setItem("mode", mode);

  // ✨ اخفاء الاختيارات
  document.getElementById("modeBox").style.display = "none";

  // 🚀 إنشاء الغرفة
  socket.emit("createRoom", "SASUKE");
}

// 📱 تطبيق شكل الموبايل
function applyMode() {
  const mode = localStorage.getItem("mode");

  if (mode === "mobile") {
    document.body.style.maxWidth = "400px";
    document.body.style.margin = "auto";
    document.body.style.border = "3px solid #000";
  }

  if (mode === "pc") {
    document.body.style.maxWidth = "100%";
  }
}

// تشغيل عند الفتح
applyMode();

// دخول من لينك
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get("room");

if (roomId) {
  const name = prompt("اكتب اسمك:");
  socket.emit("joinRoom", { roomId, name });
}

// عرض اللينك
socket.on("roomCreated", (id) => {
  const link = window.location.origin + "?room=" + id;

  const box = document.getElementById("link");
  box.style.display = "block";
  box.innerText = "📎 اللينك:\n" + link;
});

// تحديث اللاعبين
socket.on("updatePlayers", (players) => {
  const list = document.getElementById("players");
  list.innerHTML = "";

  players.forEach(p => {
    const li = document.createElement("li");

    if (p.name === "SASUKE") {
      li.textContent = "SASUKE 👑";
    } else {
      li.textContent = p.name;
    }

    list.appendChild(li);
  });
});

socket.on("errorMsg", (msg) => {
  alert(msg);
});
</script>
