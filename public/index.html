<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>لعبة الجاسوس</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  overflow: hidden;

  background: linear-gradient(-45deg, #0f0f0f, #1a1a2e, #16213e, #0f3460);
  background-size: 400% 400%;
  animation: gradientMove 20s ease infinite;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container {
  width: 95%;
  max-width: 420px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(15px);
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
  transition: 0.4s;
}

h1 {
  margin-bottom: 20px;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(45deg, #6c5ce7, #a29bfe);
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

.mode-select {
  display: none;
  gap: 10px;
  margin-top: 15px;
}

.mode-btn {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  background: #222;
  cursor: pointer;
  transition: 0.3s;
}

.mode-btn.active {
  background: linear-gradient(45deg, #00c6ff, #0072ff);
}

.link-box {
  margin-top: 15px;
  padding: 12px;
  background: #111;
  border-radius: 10px;
  word-break: break-all;
}

.player-box {
  margin-top: 10px;
  padding: 12px;
  background: #222;
  border-radius: 10px;
}

/* 🔥 وضع الموبايل الحقيقي */
body.mobile {
  align-items: flex-start;
  padding-top: 40px;
}

body.mobile .container {
  width: 100%;
  height: 100vh;
  border-radius: 0;
  max-width: 100%;
}

/* 💻 وضع الكمبيوتر */
body.pc .container {
  max-width: 420px;
}

</style>
</head>

<body>

<div class="container">

<h1>🕵️‍♂️ لعبة الجاسوس</h1>

<button onclick="createRoom()">🎮 لعبة الجاسوس 1</button>

<div class="mode-select" id="modeBox">
  <div class="mode-btn" onclick="selectMode(this, 'mobile')">📱 موبايل</div>
  <div class="mode-btn" onclick="selectMode(this, 'pc')">💻 كمبيوتر</div>
</div>

<div id="link" class="link-box" style="display:none;"></div>

<div class="player-box">SASUKE 👑</div>

<ul id="players"></ul>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let socket;

try {
  socket = io();
} catch (e) {
  alert("مشكلة في الاتصال بالسيرفر");
}

function createRoom() {
  document.getElementById("modeBox").style.display = "flex";
}

function selectMode(el, mode) {
  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  el.classList.add("active");

  localStorage.setItem("mode", mode);

  // 🔥 تطبيق الوضع فوراً
  applyMode();

  document.getElementById("modeBox").style.display = "none";

  socket.emit("createRoom", "SASUKE");
}

function applyMode() {
  const mode = localStorage.getItem("mode");

  document.body.classList.remove("mobile", "pc");

  if (mode === "mobile") {
    document.body.classList.add("mobile");
  }

  if (mode === "pc") {
    document.body.classList.add("pc");
  }
}

applyMode();

// دخول من لينك
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get("room");

if (roomId) {
  const name = prompt("اكتب اسمك:");
  socket.emit("joinRoom", { roomId, name });
}

// عرض اللينك
socket.on("roomCreated", (id) => {
  const link = window.location.origin + "?room=" + id;

  const box = document.getElementById("link");
  box.style.display = "block";
  box.innerText = "📎 اللينك:\n" + link;
});

// تحديث اللاعبين
socket.on("updatePlayers", (players) => {
  const list = document.getElementById("players");
  list.innerHTML = "";

  players.forEach(p => {
    const li = document.createElement("li");
    li.textContent = p.name;
    list.appendChild(li);
  });
});

socket.on("errorMsg", (msg) => {
  alert(msg);
});
</script>

</body>
</html>
