<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الجاسوس</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 90%;
  max-width: 400px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  padding: 25px;
  border-radius: 20px;
  text-align: center;
}

h1 {
  margin-bottom: 20px;
}

/* زر */
button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(45deg, #6c5ce7, #a29bfe);
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

/* اختيار الجهاز */
.mode-select {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.mode-btn {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  background: #222;
  cursor: pointer;
  transition: 0.3s;
}

.mode-btn.active {
  background: linear-gradient(45deg, #00c6ff, #0072ff);
}

/* لينك */
.link-box {
  margin-top: 15px;
  padding: 12px;
  background: #111;
  border-radius: 10px;
  word-break: break-all;
}

/* لاعبين */
ul {
  margin-top: 15px;
  padding: 0;
  list-style: none;
}

li {
  background: #222;
  margin: 5px 0;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🕵️‍♂️ لعبة الجاسوس</h1>

<!-- 🔥 مفيش input -->

<button onclick="createRoom()">🎮 لعبة الجاسوس 1</button>

<div class="mode-select" id="modeBox" style="display:none;">
  <div class="mode-btn" onclick="selectMode(this)">📱 موبايل</div>
  <div class="mode-btn" onclick="selectMode(this)">💻 كمبيوتر</div>
</div>

<div id="link" class="link-box" style="display:none;"></div>

<ul id="players"></ul>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io({
  transports: ["websocket"]
});

let selected = false;

// اختيار المود
function selectMode(el) {
  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  el.classList.add("active");
  selected = true;
}

// إنشاء غرفة (🔥 SASUKE ثابت)
function createRoom() {

  document.getElementById("modeBox").style.display = "flex";

  if (!selected) {
    alert("اختار موبايل او كمبيوتر");
    return;
  }

  socket.emit("createRoom", "SASUKE");
}

// دخول من لينك
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get("room");

if (roomId) {
  const name = prompt("اكتب اسمك:");
  socket.emit("joinRoom", { roomId, name });
}

// عرض اللينك
socket.on("roomCreated", (id) => {
  const link = window.location.origin + "?room=" + id;

  const box = document.getElementById("link");
  box.style.display = "block";
  box.innerText = "📎 اللينك:\n" + link;
});

// تحديث اللاعبين
socket.on("updatePlayers", (players) => {
  const list = document.getElementById("players");
  list.innerHTML = "";

  players.forEach(p => {
    const li = document.createElement("li");

    if (p.name === "SASUKE") {
      li.textContent = "SASUKE 👑";
    } else {
      li.textContent = p.name;
    }

    list.appendChild(li);
  });
});

socket.on("errorMsg", (msg) => {
  alert(msg);
});
</script>

</body>
</html>
