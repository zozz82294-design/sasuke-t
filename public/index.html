<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الجاسوس</title>

<style>
body {
  font-family: Arial;
  background: #0d0d0d;
  color: white;
  text-align: center;
  padding-top: 60px;
}

.container {
  max-width: 400px;
  margin: auto;
}

h1 {
  margin-bottom: 30px;
}

input {
  width: 90%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-bottom: 15px;
}

button {
  width: 95%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #6c5ce7;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

button:hover {
  background: #5a4bd1;
}

.link-box {
  margin-top: 20px;
  padding: 10px;
  background: #222;
  border-radius: 10px;
  word-break: break-all;
}

ul {
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🕵️‍♂️ لعبة الجاسوس</h1>

<input id="name" placeholder="اكتب اسمك">

<button onclick="createRoom()">إنشاء غرفة</button>

<div id="link" class="link-box" style="display:none;"></div>

<h3>اللاعبين:</h3>
<ul id="players"></ul>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io({
  transports: ["websocket"]
});

// لما الصفحة تفتح، نشوف لو فيه room في الرابط
const urlParams = new URLSearchParams(window.location.search);
const roomIdFromUrl = urlParams.get("room");

if (roomIdFromUrl) {
  const name = prompt("اكتب اسمك للدخول:");
  socket.emit("joinRoom", { roomId: roomIdFromUrl, name });
}

function createRoom() {
  const name = document.getElementById("name").value;

  if (!name) {
    alert("اكتب اسمك الأول");
    return;
  }

  socket.emit("createRoom", name);
}

socket.on("roomCreated", (roomId) => {
  const link = window.location.origin + "?room=" + roomId;

  const linkBox = document.getElementById("link");
  linkBox.style.display = "block";
  linkBox.innerText = "انسخ اللينك وابعته:\n" + link;
});

socket.on("updatePlayers", (players) => {
  const list = document.getElementById("players");
  list.innerHTML = "";

  players.forEach(p => {
    const li = document.createElement("li");
    li.textContent = p.name + (p.host ? " 👑" : "");
    list.appendChild(li);
  });
});

socket.on("errorMsg", (msg) => {
  alert(msg);
});
</script>

</body>
</html>
