<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الجاسوس</title>

<style>
body{
  margin:0;
  font-family:Cairo;
  background:linear-gradient(45deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

/* كروت */
.card{
  background:#1e293b;
  margin:10px;
  padding:15px;
  border-radius:15px;
  display:inline-block;
  width:150px;
  transition:.3s;
}

.card:hover{
  transform:scale(1.1);
}

.selected{
  background:#22c55e !important;
}

.spy{
  color:#ef4444;
  font-size:24px;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>🕵️‍♂️ لعبة الجاسوس</h2>

<button onclick="createRoom()">إنشاء غرفة</button>
<button id="startBtn">بدء اللعب</button>
<button onclick="startVote()">🗳️ بدء التصويت</button>

<div id="cats"></div>
<div id="role"></div>
<div id="players"></div>
<div id="guess"></div>

<script src="/socket.io/socket.io.js"></script>

<script>
let socket=io();
let isHost=false;
let myName="𝐒𝐀𝐒𝐔𝐊𝐄";
let myId=null;
let selectedCat=null;
let selectedWord=null;

socket.on("connect",()=>myId=socket.id);

function createRoom(){
  isHost=true;
  socket.emit("createRoom",myName);
}

socket.on("updatePlayers",(players)=>{
  let div=document.getElementById("players");
  div.innerHTML="";
  players.forEach(p=>{
    div.innerHTML+=`<div class="card">${p.name}</div>`;
  });

  if(players.length>=3 && isHost){
    document.getElementById("startBtn").onclick=()=>socket.emit("startGame");
  }
});

socket.on("showCategories",()=>{
  let cats=["anime","cartoon","objects","animals","apps"];
  let div=document.getElementById("cats");
  div.innerHTML="";

  cats.forEach(c=>{
    div.innerHTML+=`<div class="card" onclick="pick('${c}',this)">${c}</div>`;
  });
});

function pick(c,el){
  if(!isHost) return;
  selectedCat=c;
  document.querySelectorAll(".card").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
}

document.getElementById("startBtn").ondblclick=()=>{
  if(selectedCat) socket.emit("chooseCategory",selectedCat);
};

socket.on("role",(data)=>{
  if(data.spy){
    document.getElementById("role").innerHTML=`<div class="spy">🕵️‍♂️ انت الجاسوس</div><p>${data.cat}</p>`;
  }else{
    document.getElementById("role").innerHTML=`<h3>${data.word}</h3><p>${data.cat}</p>`;
  }
});

function startVote(){
  socket.emit("startVote");
}

socket.on("voteStart",(players)=>{
  let div=document.getElementById("players");
  div.innerHTML="";
  players.forEach(p=>{
    div.innerHTML+=`
      <div class="card">
        ${p.name}
        <br>
        <button onclick="vote('${p.id}','${p.name}')">تصويت</button>
        <div id="v_${p.id}"></div>
      </div>`;
  });
});

function vote(id,name){
  socket.emit("vote",{voter:myName,targetId:id});
}

socket.on("voteResult",(res)=>{
  if(res.selected!==res.spy){
    alert("❌ تم اختيار شخص غلط");
  }else{
    alert("✅ تم كشف الجاسوس");
  }
  socket.emit("startGuess");
});

socket.on("guessUI",(data)=>{
  let div=document.getElementById("guess");
  div.innerHTML="";

  data.words.forEach(w=>{
    div.innerHTML+=`<button onclick="pickWord('${w}',this)">${w}</button>`;
  });
});

function pickWord(w,el){
  selectedWord=w;
  document.querySelectorAll("#guess button").forEach(b=>b.classList.remove("selected"));
  el.classList.add("selected");

  socket.emit("selectGuess",{word:w,player:myName});
}

socket.on("selectUpdate",({word,player})=>{
  document.querySelectorAll("#guess button").forEach(b=>{
    if(b.innerText.includes(word)){
      b.innerText=word+" ("+player+")";
    }
  });
});

document.addEventListener("dblclick",()=>{
  if(selectedWord){
    socket.emit("confirmGuess",selectedWord);
  }
});

socket.on("guessResult",(d)=>{
  alert("🕵️‍♂️ الجاسوس خمن: "+d.word+"\n✔️ الصح: "+d.correct);
});
</script>

</body>
</html>
