<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الجاسوس</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 90%;
  max-width: 400px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  text-align: center;
}

h1 {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-bottom: 15px;
  background: #222;
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(45deg, #6c5ce7, #a29bfe);
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

.link-box {
  margin-top: 15px;
  padding: 10px;
  background: #111;
  border-radius: 10px;
  font-size: 14px;
  word-break: break-all;
}

ul {
  margin-top: 15px;
  padding: 0;
  list-style: none;
}

li {
  background: #222;
  margin: 5px 0;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🕵️‍♂️ لعبة الجاسوس</h1>

<input id="name" placeholder="اكتب اسمك">

<button onclick="createRoom()">🚀 إنشاء غرفة</button>

<div id="link" class="link-box" style="display:none;"></div>

<ul id="players"></ul>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io({
  transports: ["websocket"]
});

const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get("room");

if (roomId) {
  const name = prompt("اكتب اسمك:");

  socket.emit("joinRoom", {
    roomId: roomId,
    name: name
  });
}

function createRoom() {
  const name = document.getElementById("name").value;

  if (!name) {
    alert("اكتب اسمك");
    return;
  }

  socket.emit("createRoom", name);
}

socket.on("roomCreated", (id) => {
  const link = window.location.origin + "?room=" + id;

  const box = document.getElementById("link");
  box.style.display = "block";
  box.innerText = "📎 اللينك:\n" + link;
});

socket.on("updatePlayers", (players) => {
  const list = document.getElementById("players");
  list.innerHTML = "";

  players.forEach(p => {
    const li = document.createElement("li");
    li.textContent = p.name + (p.host ? " 👑" : "");
    list.appendChild(li);
  });
});

socket.on("errorMsg", (msg) => {
  alert(msg);
});
</script>

</body>
</html>
